# The real page collector and globals probe, injected into real Chromium against local fixture
# pages (an old self-built shop, in-page tokenization, provider-hosted card fields), analysed the
# same way the popup does.
#
# Its own workflow rather than a step in `ci`, because it downloads a browser; the unit suite runs
# in a second and should not wait for it.
name: e2e

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Collector in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: yarn install --frozen-lockfile

      - run: yarn playwright install --with-deps chromium

      - run: yarn test:e2e
