# Builds the installable zip for a version tag and publishes it with its SHA-256 on a GitHub
# release. This is the only distribution channel: there is no store listing and therefore no
# silent auto-update path.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag points at a commit on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; only reviewed commits are released"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Tag matches manifest version
        run: |
          set -euo pipefail
          manifest="$(node -p 'require("./extension/manifest.json").version')"
          if [ "v${manifest}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version ${manifest}"
            exit 1
          fi

      - run: yarn install --frozen-lockfile

      - run: yarn lint && yarn typecheck && yarn test

      - name: Package
        run: |
          set -euo pipefail
          name="safepeek-${GITHUB_REF_NAME}"
          (cd extension && zip -qr -X "../${name}.zip" .)
          sha256sum "${name}.zip" > "${name}.zip.sha256"
          cat "${name}.zip.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="safepeek-${GITHUB_REF_NAME}"
          {
            echo "Install: unzip, open chrome://extensions, turn on Developer mode, Load unpacked."
            echo
            echo "SHA-256:"
            echo '```'
            cat "${name}.zip.sha256"
            echo '```'
            echo
            echo "Signature data:"
            echo '```json'
            cat extension/data/sources.json
            echo '```'
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" "${name}.zip" "${name}.zip.sha256" --title "SafePeek ${GITHUB_REF_NAME}" --notes-file notes.md

      # The analysis engine is also published to npm as `safepeek` (extension/package.json), when an
      # NPM_TOKEN secret is configured. The package and the extension share the same source files.
      - name: Publish npm package
        if: env.NPM_TOKEN != ''
        run: |
          set -euo pipefail
          cp LICENSE extension/LICENSE
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          (cd extension && npm publish --provenance --access public)
