# Copy-paste detection (jscpd), reported to GitHub Code Scanning. Never fails the build.
#
# A global duplication percentage cannot stop new duplication; SARIF plus Code Scanning makes the
# finding per-pull-request instead of per-repository. Report-only on purpose: a check that cannot
# point precisely at what THIS diff added must not be a gate.
name: duplication-scan

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplication-scan:
    name: Duplication Scan (jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # required to upload SARIF
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run jscpd
        run: |
          set -euo pipefail
          npx --yes jscpd@4 extension tools test \
            --format "javascript" \
            --ignore "**/node_modules/**,**/data/**" \
            --reporters console,sarif \
            --output report

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: report/jscpd-sarif.json
          category: jscpd
